# Proxy reverso (servidor na DMZ) → encaminha pro servidor interno do ZapGov.
# Dois hosts: app (front) e api (backend, inclui /webhook).
# Troque:
#   INTERNAL_IP            -> IP do servidor interno onde roda o docker-compose.prod
#   app.SEU-DOMINIO        -> host do painel
#   api.SEU-DOMINIO        -> host da API/webhook
#   /etc/ssl/...           -> certificado TLS (Let's Encrypt ou institucional)

upstream zapgov_front { server INTERNAL_IP:3000; }
upstream zapgov_api   { server INTERNAL_IP:8080; }

# HTTP -> HTTPS
server {
    listen 80;
    server_name app.SEU-DOMINIO api.SEU-DOMINIO;
    return 301 https://$host$request_uri;
}

# ---- Painel (front) ----
server {
    listen 443 ssl http2;
    server_name app.SEU-DOMINIO;

    ssl_certificate     /etc/ssl/zapgov/fullchain.pem;
    ssl_certificate_key /etc/ssl/zapgov/privkey.pem;

    location / {
        proxy_pass http://zapgov_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- API + Webhook ----
server {
    listen 443 ssl http2;
    server_name api.SEU-DOMINIO;

    ssl_certificate     /etc/ssl/zapgov/fullchain.pem;
    ssl_certificate_key /etc/ssl/zapgov/privkey.pem;

    # Payload de mídia/webhook pode ser grande.
    client_max_body_size 25m;

    # SSE (tempo real do inbox): sem buffer e timeout longo.
    location /events {
        # O token SSE está na query string: não registrar a URL completa.
        access_log off;
        proxy_pass http://zapgov_api;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://zapgov_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
